name: Deploy static site

on:
  push:
    branches: [main, codex/live-solo-search]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Check first-party JavaScript syntax
        run: node --check static/app.js && node --check static/catalog.js && node --check static/search-worker.js && node --check static/listen/listen.js && node --check static/listen/retrieval-worker.js && node --check static/listen/audio-capture.js
      - name: Run database-independent tests
        run: python -m pytest -q tests/listen tests/test_joint_search.py tests/test_static_export.py tests/test_dtl_export.py
      - name: Validate complete listening corpus
        run: python -m jazzmine.listen_validate
      - name: Run listening search tests
        run: npm run test:listen:unit
      - name: Verify committed model assets
        run: npm run verify:listen
      - name: Validate published catalog
        run: python -m jazzmine.static_validate
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke gate
        run: npx playwright test

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static
      - id: deployment
        uses: actions/deploy-pages@v4
